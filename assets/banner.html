<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --blue:#1b9aff; --blue2:#5cc0ff; --ink:#05080d; --text:#e9f1fb; --mute:#8fa3bc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1280px; height:640px; overflow:hidden; background:var(--ink); }
  .b { position:relative; width:1280px; height:640px; overflow:hidden; font-family:Inter,sans-serif; color:var(--text);
    background:
      radial-gradient(620px 520px at 1010px 330px, rgba(27,154,255,.30), transparent 70%),
      radial-gradient(900px 500px at 200px 700px, rgba(27,154,255,.10), transparent 70%),
      linear-gradient(135deg, #0a1220 0%, #05080d 55%, #04070b 100%); }
  /* fine grid, fading out toward the left */
  .grid { position:absolute; inset:0; opacity:.55;
    background-image: linear-gradient(rgba(140,190,255,.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(140,190,255,.07) 1px, transparent 1px);
    background-size:40px 40px;
    -webkit-mask-image: radial-gradient(700px 520px at 1000px 320px, #000 10%, transparent 75%); }
  /* light beam */
  .beam { position:absolute; top:-200px; left:640px; width:220px; height:1100px; transform:rotate(28deg);
    background:linear-gradient(90deg, transparent, rgba(92,192,255,.08), transparent); }
  .ring { position:absolute; left:1012px; top:298px; border-radius:50%; transform:translate(-50%,-50%);
    border:1px solid rgba(92,192,255,.16); }
  .logo { position:absolute; left:812px; top:96px; width:400px; height:400px;
    filter: drop-shadow(0 0 34px rgba(27,154,255,.45)) drop-shadow(0 24px 40px rgba(0,0,0,.6)); }
  .left { position:absolute; left:80px; top:78px; width:680px; }
  .pill { display:inline-flex; align-items:center; gap:10px; padding:8px 16px 8px 12px; border-radius:999px;
    border:1px solid rgba(92,192,255,.35); background:rgba(27,154,255,.10);
    font:600 15px/1 Inter; letter-spacing:.14em; text-transform:uppercase; color:#cfe6ff; }
  .pill i { width:8px; height:8px; border-radius:50%; background:var(--blue); box-shadow:0 0 12px var(--blue); }
  h1 { margin-top:22px; font:800 156px/0.86 'Barlow Condensed'; letter-spacing:-.01em; color:#fff;
    text-shadow:0 6px 30px rgba(0,0,0,.5); }
  h1 span { color:#2ea7ff; text-shadow:0 0 28px rgba(27,154,255,.55), 0 0 2px rgba(143,211,255,.6); }
  .sub { margin-top:22px; font:500 25px/1.38 Inter; color:#b9c8da; max-width:620px; }
  .sub b { color:#fff; font-weight:600; }
  .statlabel { position:absolute; left:82px; bottom:178px; font:600 12px/1 Inter; letter-spacing:.16em;
    text-transform:uppercase; color:#7f95ae; }
  .statlabel b { color:#cfe6ff; font-weight:600; }
  .stats { position:absolute; left:80px; bottom:58px; display:flex; gap:14px; }
  .card { position:relative; width:200px; padding:17px 18px 15px; border-radius:16px; overflow:hidden;
    background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.35); }
  .card::before { content:""; position:absolute; left:18px; right:18px; top:0; height:2px; border-radius:0 0 2px 2px;
    background:linear-gradient(90deg, rgba(92,192,255,0), var(--blue2), rgba(92,192,255,0)); opacity:.75; }
  .card .n { display:flex; align-items:baseline; gap:6px; font:700 46px/1 'Barlow Condensed'; color:#fff; letter-spacing:.005em; }
  .card .n em { font-style:normal; color:var(--blue2); font-size:24px; letter-spacing:.02em; }
  .card .g { margin-top:8px; font:500 14.5px/1.25 Inter; color:#9fb2c8; white-space:nowrap; }
  .by { position:absolute; left:1012px; bottom:64px; transform:translateX(-50%); text-align:center; }
  .by .t { font:700 26px/1 'Barlow Condensed'; letter-spacing:.04em; text-transform:uppercase; color:#fff; }
  .by .t span { color:var(--blue); }
  .by .u { font:600 16px/1 Inter; color:#9fb6d0; letter-spacing:.06em; }
  .edge { position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--blue) 30%, var(--blue2) 60%, transparent); opacity:.8; }
</style></head>
<body><div class="b">
  <div class="grid"></div><div class="beam"></div>
  <div class="ring" style="width:470px;height:470px"></div>
  <div class="ring" style="width:600px;height:600px;border-color:rgba(92,192,255,.08)"></div>
  <img class="logo" src="sml-logo.png" alt="">
  <div class="left">
    <div class="pill"><i></i>Decky plugin · Steam Machine</div>
    <h1>FSR 4.1 <span>Lite</span></h1>
    <p class="sub">AMD's FSR 4.1.2 Lite model, one button per game.<br><b>FSR 4 image quality at FSR 3 frame rates.</b></p>
  </div>
  <div class="statlabel">FPS gained over <b>stock FSR 4.1</b> · 4K</div>
  <div class="stats">
    <div class="card"><div class="n">+18<em>FPS</em></div><div class="g">Payday 3</div></div>
    <div class="card"><div class="n">+13<em>FPS</em></div><div class="g">Dying Light: The Beast</div></div>
    <div class="card"><div class="n">+20<em>FPS</em></div><div class="g">Cyberpunk 2077</div></div>
  </div>
  <div class="by"><div class="u">steammachinelife.com</div></div>
  <div class="edge"></div>
</div></body></html>
